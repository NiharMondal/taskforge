# Local Postgres for development and the backend e2e suite.
#
#   docker compose up -d
#
# Creates two databases: `taskforge` (dev) and `taskforge_e2e` (e2e tests,
# which refuse to run against a database without "e2e"/"test" as a word in
# its name).
# Port 5433 on the host so it doesn't collide with a locally installed Postgres.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
      POSTGRES_DB: taskforge
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
